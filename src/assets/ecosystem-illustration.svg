<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="300" r="280" fill="url(#bgGlow)"/>

  <g stroke="#D9D2F0" stroke-width="1.5" fill="none">
    <path d="M400,300 L180,140"/>
    <path d="M400,300 L620,140"/>
    <path d="M400,300 L150,320"/>
    <path d="M400,300 L650,320"/>
    <path d="M400,300 L230,470"/>
    <path d="M400,300 L570,470"/>
    <path d="M400,300 L400,110"/>
    <path d="M400,300 L400,490"/>
    <path d="M180,140 L400,110"/>
    <path d="M620,140 L400,110"/>
    <path d="M150,320 L230,470"/>
    <path d="M650,320 L570,470"/>
  </g>

  <g stroke="#7C3AED" stroke-width="2" fill="none" opacity="0.55">
    <path d="M400,300 L180,140"/>
    <path d="M400,300 L650,320"/>
    <path d="M400,300 L400,490"/>
  </g>

  <!-- Central core node: the AI reasoning engine -->
  <circle cx="400" cy="300" r="34" fill="url(#coreGrad)"/>
  <circle cx="400" cy="300" r="34" fill="none" stroke="#EDE9FE" stroke-width="2"/>
  <circle cx="400" cy="300" r="46" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>

  <!-- Satellite nodes: products/domains around the core -->
  <circle cx="180" cy="140" r="16" fill="url(#nodeGrad)"/>
  <circle cx="620" cy="140" r="12" fill="#E4DFF5" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="150" cy="320" r="12" fill="#E4DFF5" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="650" cy="320" r="18" fill="url(#nodeGrad)"/>
  <circle cx="230" cy="470" r="12" fill="#E4DFF5" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="570" cy="470" r="14" fill="url(#nodeGrad)"/>
  <circle cx="400" cy="110" r="10" fill="#E4DFF5" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="400" cy="490" r="16" fill="url(#nodeGrad)"/>

  <!-- small orbiting particles for a sense of motion -->
  <circle cx="290" cy="220" r="3.5" fill="#A78BFA"/>
  <circle cx="510" cy="230" r="3" fill="#A78BFA"/>
  <circle cx="330" cy="390" r="3" fill="#A78BFA"/>
  <circle cx="480" cy="380" r="4" fill="#A78BFA"/>
  <circle cx="400" cy="200" r="2.5" fill="#7C3AED"/>
</svg>
